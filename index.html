<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛宝跑图台 · 入口</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--tx:#e6e9ef;--dim:#8b93a7;--acc:#e0a03c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{text-align:center;max-width:420px;padding:40px 30px}
  h1{font-size:24px;margin-bottom:8px}
  h1 span{color:var(--acc)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:28px}
  #status{color:var(--dim);font-size:13px;margin-bottom:20px;min-height:20px}
  .btn{display:inline-block;background:var(--acc);color:#1a1a1a;border:none;border-radius:8px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:wait}
  .links{margin-top:24px;font-size:12px;color:var(--dim)}
  .links a{color:var(--acc);text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<div class="box">
  <h1>洛宝<span>跑图台</span></h1>
  <div class="sub">正在寻找后端服务…</div>
  <div id="status">探测中</div>
  <button class="btn" id="goBtn" disabled onclick="go()">进入跑图台</button>
  <div class="links" id="links" style="display:none">
    手动选择：
    <a href="http://127.0.0.1:8770">8770（本地）</a>
    <a href="http://127.0.0.1:8765">8765（App）</a>
  </div>
</div>

<script>
const PORTS = [8770, 8765];
let found = null;

async function tryPort(p){
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch('http://127.0.0.1:'+p+'/api/backend', {signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const d = await r.json();
    return {p, d};
  }catch(e){ return null; }
}

async function init(){
  const st = document.getElementById('status');
  // 当前页面若经后端提供（http://host/index.html），直接用同源
  if(location.protocol.startsWith('http')){
    try{
      const r = await fetch('api/backend');
      if(r.ok){
        const d = await r.json();
        found = {p: location.port || (location.protocol==='https:'?443:80), d};
        st.textContent = '✅ 已连接后端 (端口 '+found.p+')';
        document.getElementById('goBtn').disabled = false;
        document.getElementById('goBtn').textContent = '进入跑图台 (127.0.0.1:'+found.p+')';
        return;
      }
    }catch(e){}
  }
  // file:// 或同源失败：逐端口探测
  for(const p of PORTS){
    st.textContent = '尝试 127.0.0.1:'+p+' …';
    const res = await tryPort(p);
    if(res){
      found = res;
      st.textContent = '✅ 后端在 127.0.0.1:'+p+' (端口 '+p+')';
      document.getElementById('goBtn').disabled = false;
      document.getElementById('goBtn').textContent = '进入跑图台 (127.0.0.1:'+p+')';
      return;
    }
  }
  st.textContent = '❌ 未检测到后端服务';
  document.getElementById('links').style.display = 'block';
}

function go(){
  if(found) location.href = 'http://127.0.0.1:'+found.p+'/';
}

init();
</script>
</body>
</html>
