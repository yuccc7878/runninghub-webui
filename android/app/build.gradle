plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.yuccc.runninghub'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuccc.runninghub"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "0.5.3"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            buildPython "python3"
            pip {
                install "requests"
                install "pillow"
                install "numpy"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI 注入签名（ANDROID_KEYSTORE_B64 / PASS / ALIAS），本地无则跳过
            def ksB64 = System.getenv('ANDROID_KEYSTORE_B64')
            def ksPass = System.getenv('ANDROID_KEYSTORE_PASS')
            def ksAlias = System.getenv('ANDROID_KEY_ALIAS')
            if (ksB64 && ksPass && ksAlias) {
                signingConfig signingConfigs.create('release') {
                    def f = new File("${rootProject.projectDir}/release.jks")
                    f.bytes = Base64.getDecoder().decode(ksB64)
                    storeFile f
                    storePassword ksPass
                    keyAlias ksAlias
                    keyPassword ksPass
                }
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 把 python 后端目录指向 src/main/python
    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}